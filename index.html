/* ---------- barre du haut ---------- */
header.top{background:var(--green);color:var(--cream);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand b{font-family:var(--serif);font-size:20px;letter-spacing:.2px;display:block;line-height:1.1}
.brand small{opacity:.7;font-size:12px;letter-spacing:.4px}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--cream);opacity:.8;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px}
.seg button.on{background:var(--cream);color:var(--green);opacity:1;font-weight:700}
.bdg{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--fire);color:#2a1800;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.bdg:empty,.bdg.zero{display:none}

/* ---------- panneaux ---------- */
main{display:grid;min-height:calc(100vh - 66px)}
body.v-split main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.v-salle #cuisine,body.v-salle #reglages,body.v-cuisine #salle,body.v-cuisine #reglages,
body.v-reglages #salle,body.v-reglages #cuisine,body.v-split #reglages{display:none}
@media(max-width:960px){body.v-split main{grid-template-columns:1fr}}
.pane{padding:18px;overflow:auto}
h2.pt{font-family:var(--serif);font-size:19px;margin:0 0 14px;color:var(--green)}
h3.st{margin:22px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--mute);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:6px 0}

/* ---------- salle ---------- */
.zone-l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.grid-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tbtn{position:relative;height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;color:var(--ink);padding:0 6px;transition:.12s}
.tbtn:hover{border-color:var(--green-l)}
.tbtn.sel{background:var(--green);border-color:var(--green);color:var(--cream)}
.tbtn.busy::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--fire)}
.tbtn:disabled{opacity:.35;cursor:not-allowed;background:var(--sand)}
.cats{display:flex;gap:6px;margin:16px 0 10px;background:var(--sand);padding:4px;border-radius:12px}
.cats button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.cats button.on{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mi{min-height:56px;padding:10px 12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);transition:.1s}
.mi:active{transform:scale(.97);background:var(--sand)}
.draft{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.dsvc{padding:8px 0;border-bottom:1px dashed var(--line)}
.dsvc:last-of-type{border-bottom:0}
.dsvc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px}
.dsvc-h b{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--green)}
.ftog{border:1.5px solid var(--line);background:var(--sand);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mute)}
.ftog.on{background:var(--fire-bg);border-color:var(--fire);color:#7a4a00}
.line{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:15px}
.qty{display:flex;gap:10px;align-items:center;font-weight:600}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--green)}
input.txt,select.txt{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
input.txt:focus{outline:2px solid var(--green-l);border-color:transparent}
.btn{border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--green);color:var(--cream);width:100%;margin-top:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:0}
.btn.alt{background:var(--sand);color:var(--green)}
.btn.dng{background:#f4dcd6;color:var(--danger)}
.ao{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-bottom:8px}
.ao-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ao-h b{font-size:17px;font-family:var(--serif)}
.ao-h span{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;font-size:13px;border:1.5px solid var(--line);background:var(--sand);color:var(--mute);font-weight:500}
.chip.fire{background:var(--fire-bg);border-color:var(--fire);color:#7a4a00}
.chip.sent{background:var(--ok-bg);border-color:#9fd3b6;color:#27694a;text-decoration:line-through}
.chip.ready{background:var(--ok-bg);border-color:var(--ok);color:#1d5a3b;font-weight:700}
.chip button{border:0;background:var(--green);color:var(--cream);border-radius:12px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:600}

/* ---------- cuisine ---------- */
#cuisine{background:var(--k-bg);color:var(--k-ink)}
#cuisine h2.pt{color:var(--cream)}
#cuisine h3.st{color:var(--k-mute)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.ticket{background:var(--k-card);border:1.5px solid var(--k-line);border-radius:var(--r);overflow:hidden}
.ticket.hot{border-color:var(--fire)}
.t-h{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--k-head)}
.t-h b{font-family:var(--serif);font-size:22px}
.t-h span{font-size:13px;color:var(--k-mute);text-align:right}
.t-h span.late{color:var(--fire);font-weight:700}
.t-note{margin:10px 14px 0;padding:8px 11px;background:#4a3708;color:#ffd98a;border-radius:9px;font-size:13px;font-weight:500}
.ksvc{padding:11px 14px;border-top:1px solid var(--k-line)}
.ksvc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ksvc-h b{font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:.5px}
.tag.fire{background:var(--fire);color:#2a1800}
.tag.wait{background:#26382f;color:var(--k-mute)}
.tag.sent{background:#17402b;color:#58d68d}
.ksvc ul{list-style:none;padding:0;margin:0 0 9px}
.ksvc li,ul.gi li{font-size:18px;padding:2px 0;font-weight:500}
.ksvc.wait{opacity:.42}
.ksvc.sent li{text-decoration:line-through;color:var(--k-mute)}
.ksvc.fire{background:#2b2512}
.ksvc.fire.flash{animation:flash 1s ease-in-out 3}
@keyframes flash{50%{background:#5c3f08}}
.kbtn{width:100%;padding:14px;border:0;border-radius:11px;font-size:17px;font-weight:700;cursor:pointer;background:#58d68d;color:#06281a}
.kbtn.ghost{background:transparent;border:1.5px solid var(--k-line);color:var(--k-mute);font-size:13px;font-weight:500;padding:8px}
.kbtn.row{width:auto;padding:9px 14px;font-size:14px}
.sentline{font-size:12px;color:var(--k-mute);display:flex;justify-content:space-between;align-items:center}
.sentline button,.minib{background:transparent;border:1px solid var(--k-line);color:var(--k-mute);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.t-foot{display:flex;gap:8px;padding:0 14px 12px}
.t-foot .minib{margin-left:auto}
.gbody{padding:12px 14px}
ul.gi{list-style:none;padding:0;margin:0 0 12px}
.ready-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ready{background:#143525;border:1.5px solid #2f8a5a;border-radius:var(--r);padding:12px;text-align:center}
.ready .n{font-family:var(--serif);font-size:38px;line-height:1;color:#7ae7a9;margin:2px 0 4px}
.ready small{color:var(--k-mute);display:block;margin-bottom:10px;font-size:12px}
.ready .kbtn{margin-bottom:6px}
.done-list{display:flex;flex-wrap:wrap;gap:8px}
.done{font-size:13px;color:var(--k-mute);border:1px solid var(--k-line);padding:5px 10px;border-radius:8px}
.kempty{color:var(--k-mute);padding:26px 0;text-align:center}

/* ---------- réglages ---------- */
#reglages{max-width:900px;margin:0 auto;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-family:var(--serif);font-size:17px;color:var(--green)}
.card p.h{margin:0 0 14px;color:var(--mute);font-size:13px}
.trow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.trow.add{grid-template-columns:1fr 1fr auto;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.trow.ser{grid-template-columns:1fr 70px 70px 1fr auto}
.x{border:0;background:#f4dcd6;color:var(--danger);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
.lbl{font-size:12px;color:var(--mute);margin:0 0 4px;font-weight:600}
.mitems{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.mtag{display:inline-flex;align-items:center;gap:6px;background:var(--sand);border-radius:20px;padding:6px 6px 6px 12px;font-size:13px}
.mtag button{border:0;background:#fff;color:var(--danger);width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1}
.madd{display:flex;gap:8px}
.mcat{margin-bottom:14px}
.mcat b{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--green)}
.note-box{background:var(--fire-bg);border:1px solid #f0cf94;border-radius:10px;padding:10px 12px;font-size:13px;color:#6b4300}

/* ---------- aperçu bon ---------- */
#pv{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#pv.on{display:flex}
.pv-in{max-height:92vh;overflow:auto;text-align:center}
.paper{width:300px;background:#fff;color:#111;font-family:'Courier New',monospace;padding:18px 16px;text-align:left;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);margin:0 auto}
.paper h4{margin:0;text-align:center;font-size:17px;letter-spacing:1px}
.paper .c{text-align:center}
.paper hr{border:0;border-top:1px dashed #111;margin:9px 0}
.paper .big{font-size:26px;font-weight:700;text-align:center;margin:4px 0}
.paper .sv{font-weight:700;margin-top:8px;text-transform:uppercase}
.paper .fi{font-size:16px}
.pv-actions{display:flex;gap:8px;margin-top:12px;justify-content:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green-d);color:var(--cream);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body class="v-split">
<header class="top">
  <div class="brand"><span class="logo"></span><div><b>Le Carrelet</b><small id="sub">Service restaurant</small></div></div>
  <div class="seg" id="modes"></div>
  <div class="seg" id="tabs"></div>
</header>
<main>
  <section class="pane" id="salle"></section>
  <section class="pane" id="cuisine"></section>
  <section class="pane" id="reglages"></section>
</main>
<div id="pv"><div class="pv-in" id="pv-in"></div></div>
<div id="toast"></div>

<script>
/* ================= données ================= */
const CATS={
  resto:[{k:'entree',l:'Entrée'},{k:'plat',l:'Plat'},{k:'dessert',l:'Dessert'}],
  guing:[{k:'mange',l:'À manger'},{k:'sucre',l:'Sucré'},{k:'boisson',l:'Boissons'}]
};
const DEF={
  tables:[1,2,3,4,5,6,7,8].map(n=>({name:String(n),zone:'Salle'})).concat([1,2,3,4].map(n=>({name:'T'+n,zone:'Terrasse'}))),
  beeperCount:30,
  menu:{
    resto:{
      entree:['Soupe du jour','Salade de chèvre chaud','Foie gras maison','Tartare de saumon','Velouté de potimarron','Assiette de charcuterie'],
      plat:['Magret de canard','Entrecôte frites','Risotto aux champignons','Pavé de cabillaud','Burger maison','Plat végétarien du jour'],
      dessert:['Tiramisu maison','Crème brûlée','Moelleux au chocolat','Tarte tatin','Café gourmand','Glace 2 boules']
    },
    guing:{
      mange:['Frites','Burger guinguette','Hot-dog','Moules-frites','Salade composée','Planche à partager'],
      sucre:['Gaufre sucre','Gaufre chocolat','Crêpe sucre','Glace 2 boules','Tiramisu maison'],
      boisson:['Bière pression','Cidre','Limonade','Rosé (verre)','Café','Eau']
    }
  }
};
const clone=o=>JSON.parse(JSON.stringify(o));
function loadPrefs(){try{const r=localStorage.getItem('carrelet_prefs_v2');if(r){const o=JSON.parse(r);if(o&&o.tables&&o.menu&&o.menu.resto&&o.menu.guing)return Object.assign(clone(DEF),o);}}catch(e){}return clone(DEF);}
function savePrefs(){try{localStorage.setItem('carrelet_prefs_v2',JSON.stringify(S));}catch(e){}}
let S=loadPrefs();
let orders=[], nextId=1, mode='resto', cur={resto:'entree',guing:'mange'}, dr=newDrafts();

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const mins=ts=>Math.max(0,Math.floor((Date.now()-ts)/60000));
const lbl=k=>CATS.resto.find(s=>s.k===k).l;
function newDrafts(){return {
  resto:{table:null,items:{entree:[],plat:[],dessert:[]},fire:{entree:true,plat:false,dessert:false},note:''},
  guing:{beeper:null,items:{mange:[],sucre:[],boisson:[]},note:''}};}

function seed(){
  const now=Date.now(),M=60000; nextId=1;
  const R=(table,svcs,created,note)=>({id:nextId++,mode:'resto',table,createdAt:now+created*M,note,
    services:svcs.map(([k,items,state,t])=>({k,items,state,firedAt:state==='wait'?null:now+(t-1)*M,sentAt:state==='sent'?now+t*M:null}))});
  const G=(beeper,items,state,created,ready,note)=>({id:nextId++,mode:'guing',beeper,items,state,createdAt:now+created*M,readyAt:ready?now+ready*M:null,note:note||''});
  orders=[
    R('2',[['entree',['Soupe du jour x2'],'sent',-38],['plat',['Entrecôte frites','Burger maison'],'sent',-18],['dessert',['Tiramisu maison','Café gourmand'],'wait',null]],-45,''),
    R('4',[['entree',['Foie gras maison','Tartare de saumon'],'sent',-22],['plat',['Magret de canard x2','Risotto aux champignons'],'fire',-1],['dessert',['Moelleux au chocolat x3'],'wait',null]],-30,'Allergie noix'),
    R('T2',[['entree',['Salade de chèvre chaud x2'],'fire',-2],['plat',['Pavé de cabillaud','Entrecôte frites'],'wait',null],['dessert',['Tarte tatin x2'],'wait',null]],-6,''),
    G(12,['Burger guinguette x2','Frites x2','Bière pression x2'],'prep',-9,null,'Un burger sans oignon'),
    G(5,['Moules-frites','Limonade'],'ready',-8,-1),
    G(21,['Gaufre chocolat','Café'],'prep',-2,null)
  ];
}

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2600);}

/* ================= calculs ================= */
const activeResto=()=>orders.filter(o=>o.mode==='resto'&&o.services.some(s=>s.state!=='sent'));
const doneResto=()=>orders.filter(o=>o.mode==='resto'&&o.services.every(s=>s.state==='sent'));
const guingPrep=()=>orders.filter(o=>o.mode==='guing'&&o.state==='prep');
const guingReady=()=>orders.filter(o=>o.mode==='guing'&&o.state==='ready');
const guingOpen=()=>orders.filter(o=>o.mode==='guing'&&o.state!=='done');
const hotCount=()=>activeResto().reduce((n,o)=>n+o.services.filter(s=>s.state==='fire').length,0);
const pending={resto:()=>hotCount(),guing:()=>guingPrep().length};

/* ================= actions ================= */
function setService(oid,k,st){
  const o=orders.find(x=>x.id==oid);if(!o)return;const s=o.services.find(x=>x.k===k);if(!s)return;
  if(st==='fire'){s.state='fire';s.firedAt=Date.now();s.sentAt=null;}
  if(st==='sent'){s.state='sent';s.sentAt=Date.now();}
  renderAll();
}
function sendOrder(){
  if(mode==='resto'){
    const d=dr.resto, pop=CATS.resto.filter(s=>d.items[s.k].length);
    if(!d.table||!pop.length)return;
    const anyFire=pop.some(s=>d.fire[s.k]);
    const services=pop.map((s,i)=>{const f=d.fire[s.k]||(!anyFire&&i===0);
      return {k:s.k,items:d.items[s.k].map(it=>it.qty>1?`${it.name} x${it.qty}`:it.name),state:f?'fire':'wait',firedAt:f?Date.now():null,sentAt:null};});
    orders.push({id:nextId++,mode:'resto',table:d.table,createdAt:Date.now(),note:d.note.trim(),services});
    toast(`Table ${d.table} envoyée en cuisine`);
    dr.resto={table:null,items:{entree:[],plat:[],dessert:[]},fire:{entree:true,plat:false,dessert:false},note:''};cur.resto='entree';
  }else{
    const d=dr.guing, items=[];
    CATS.guing.forEach(c=>d.items[c.k].forEach(it=>items.push(it.qty>1?`${it.name} x${it.qty}`:it.name)));
    if(!d.beeper||!items.length)return;
    orders.push({id:nextId++,mode:'guing',beeper:d.beeper,items,state:'prep',createdAt:Date.now(),readyAt:null,note:d.note.trim()});
    toast(`Beeper n°${d.beeper} envoyé en cuisine`);
    dr.guing={beeper:null,items:{mange:[],sucre:[],boisson:[]},note:''};cur.guing='mange';
  }
  renderAll();
}
function tableIdx(name){return S.tables.findIndex(t=>t.name===name);}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, d=dr[mode], ds=b.dataset;
  switch(a){
    case 'view':document.body.className='v-'+ds.v;renderTop();break;
    case 'mode':mode=ds.m;renderAll();break;
    case 'table':dr.resto.table=S.tables[+ds.i].name;renderSalle();break;
    case 'beep':dr.guing.beeper=+ds.n;renderSalle();break;
    case 'cat':cur[mode]=ds.k;renderSalle();break;
    case 'add':{const name=S.menu[mode][cur[mode]][+ds.i],list=d.items[cur[mode]],ex=list.find(x=>x.name===name);ex?ex.qty++:list.push({name,qty:1});renderSalle();break;}
    case 'qty':{const list=d.items[ds.k],it=list[+ds.i];it.qty+=+ds.d;if(it.qty<=0)list.splice(+ds.i,1);renderSalle();break;}
    case 'ftoggle':dr.resto.fire[ds.k]=!dr.resto.fire[ds.k];renderSalle();break;
    case 'send':sendOrder();break;
    case 'fire':setService(ds.o,ds.k,'fire');toast(`Relance : ${lbl(ds.k)} demandé(e) en cuisine`);break;
    case 'sent':setService(ds.o,ds.k,'sent');break;
    case 'undo':setService(ds.o,ds.k,'fire');break;
    case 'gready':{const o=orders.find(x=>x.id==ds.o);o.state='ready';o.readyAt=Date.now();renderAll();toast(`Beeper n°${o.beeper} prêt : faire sonner`);break;}
    case 'gdone':{const o=orders.find(x=>x.id==ds.o);o.state='done';renderAll();break;}
    case 'gback':{const o=orders.find(x=>x.id==ds.o);o.state='prep';o.readyAt=null;renderAll();break;}
    case 'gring':{const o=orders.find(x=>x.id==ds.o);toast(`Démo : le signal vers le beeper n°${o.beeper} sera envoyé ici (liaison à brancher)`);break;}
    case 'preview':showPreview(ds.o);break;
    case 'closepv':document.getElementById('pv').classList.remove('on');break;
    case 'doprint':toast('Démo : l’impression réelle se branchera sur vos imprimantes');break;
    case 'resetdemo':seed();dr=newDrafts();renderAll();toast('Données de démo rechargées');break;
    /* réglages */
    case 'tadd':{const n=document.getElementById('ta-n').value.trim(),z=document.getElementById('ta-z').value.trim();
      if(!n)return toast('Donnez un nom à la table');if(tableIdx(n)>=0)return toast('Ce nom existe déjà');
      S.tables.push({name:n,zone:z});savePrefs();renderAll();break;}
    case 'tser':{const p=document.getElementById('ts-p').value.trim(),f=parseInt(document.getElementById('ts-a').value),t=parseInt(document.getElementById('ts-b').value),z=document.getElementById('ts-z').value.trim();
      if(isNaN(f)||isNaN(t)||t<f||t-f>99)return toast('Série invalide (ex. de 1 à 10)');
      let n=0;for(let i=f;i<=t;i++){const name=p+i;if(tableIdx(name)<0){S.tables.push({name,zone:z});n++;}}
      savePrefs();renderAll();toast(n+' table(s) ajoutée(s)');break;}
    case 'tdel':{const t=S.tables[+ds.i];if(activeResto().some(o=>o.table===t.name))return toast('Table en service : impossible de la supprimer');
      S.tables.splice(+ds.i,1);if(dr.resto.table===t.name)dr.resto.table=null;savePrefs();renderAll();break;}
    case 'madd':{const inp=document.getElementById(`mi-${ds.m}-${ds.k}`),v=inp.value.trim();if(!v)return;
      S.menu[ds.m][ds.k].push(v);savePrefs();renderAll();break;}
    case 'mdel':S.menu[ds.m][ds.k].splice(+ds.i,1);savePrefs();renderAll();break;
    case 'resetprefs':S=clone(DEF);savePrefs();renderAll();toast('Réglages remis par défaut');break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='note')dr[mode].note=e.target.value;});
document.addEventListener('change',e=>{
  const t=e.target,ed=t.dataset.edit;
  if(ed==='tname'){const i=+t.dataset.i,v=t.value.trim();if(!v||(tableIdx(v)>=0&&tableIdx(v)!==i)){toast('Nom vide ou déjà utilisé');renderSettings();return;}
    if(activeResto().some(o=>o.table===S.tables[i].name)){toast('Table en service : renommage impossible');renderSettings();return;}
    if(dr.resto.table===S.tables[i].name)dr.resto.table=v;S.tables[i].name=v;savePrefs();renderAll();}
  if(ed==='tzone'){S.tables[+t.dataset.i].zone=t.value.trim();savePrefs();renderAll();}
  if(t.id==='bcount'){let n=parseInt(t.value);if(isNaN(n))n=30;S.beeperCount=Math.max(1,Math.min(99,n));savePrefs();renderAll();}
  if(t.dataset.edit==='mitem'){const arr=S.menu[t.dataset.m][t.dataset.k],v=t.value.trim();if(v)arr[+t.dataset.i]=v;savePrefs();renderAll();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[id^="mi-"]')){const [,m,k]=e.target.id.split('-');
    const v=e.target.value.trim();if(v){S.menu[m][k].push(v);savePrefs();renderAll();}}
});

/* ================= aperçu bon ================= */
function showPreview(oid){
  const o=orders.find(x=>x.id==oid);if(!o)return;
  let h='<div class="paper"><h4>LE CARRELET</h4><div class="c">'+(o.mode==='guing'?'Guinguette':'Restaurant')+' · '+fmt(o.createdAt)+'</div><hr>';
  if(o.mode==='resto'){
    h+=`<div class="big">TABLE ${esc(o.table)}</div>`;
    if(o.note)h+=`<div>** ${esc(o.note)} **</div>`;
    o.services.forEach(s=>{h+=`<div class="sv">— ${lbl(s.k)} ${s.state==='wait'?'(attente)':'(DE SUITE)'}</div>`;s.items.forEach(i=>h+=`<div class="fi">${esc(i)}</div>`);});
  }else{
    h+=`<div class="big">BEEPER ${o.beeper}</div>`;
    if(o.note)h+=`<div>** ${esc(o.note)} **</div><hr>`;
    o.items.forEach(i=>h+=`<div class="fi">${esc(i)}</div>`);
  }
  h+='<hr><div class="c">bon n°'+o.id+'</div></div>';
  h+='<div class="pv-actions"><button class="btn sm" data-act="doprint">Imprimer</button><button class="btn sm alt" data-act="closepv">Fermer</button></div>';
  document.getElementById('pv-in').innerHTML=h;document.getElementById('pv').classList.add('on');
}
document.getElementById('pv').addEventListener('click',e=>{if(e.target.id==='pv')e.target.classList.remove('on');});

/* ================= rendu : haut ================= */
function renderTop(){
  const cl=document.body.className.replace('v-','');
  const mb=m=>{const n=pending[m]();return `<button class="${mode===m?'on':''}" data-act="mode" data-m="${m}">${m==='resto'?'Restaurant':'Guinguette'}<span class="bdg${n&&mode!==m?'':' zero'}">${n||''}</span></button>`;};
  document.getElementById('modes').innerHTML=mb('resto')+mb('guing');
  const nb=pending[mode]();
  const tb=(v,t,extra)=>`<button class="${cl===v?'on':''}" data-act="view" data-v="${v}">${t}${extra||''}</button>`;
  document.getElementById('tabs').innerHTML=tb('salle','Salle')+tb('cuisine','Cuisine',`<span class="bdg${nb?'':' zero'}">${nb||''}</span>`)+tb('split','Côte à côte')+tb('reglages','Réglages');
  document.getElementById('sub').textContent=mode==='resto'?'Service restaurant':'Guinguette · envoi rapide';
}

/* ================= rendu : salle ================= */
function menuBlock(){
  const cats=CATS[mode],d=dr[mode];
  let h='<div class="cats">';
  cats.forEach(c=>{const n=d.items[c.k].reduce((s,i)=>s+i.qty,0);h+=`<button class="${cur[mode]===c.k?'on':''}" data-act="cat" data-k="${c.k}">${c.l}${n?' ('+n+')':''}</button>`;});
  h+='</div><div class="menu">';
  S.menu[mode][cur[mode]].forEach((n,i)=>h+=`<button class="mi" data-act="add" data-i="${i}">${esc(n)}</button>`);
  h+='</div>';
  if(!S.menu[mode][cur[mode]].length)h+='<div class="empty">Aucun plat ici : ajoutez-en dans Réglages.</div>';
  return h;
}
function renderSalle(){
  const el=document.getElementById('salle');let h='';
  if(mode==='resto'){
    const d=dr.resto,busy=new Set(activeResto().map(o=>o.table));
    h+='<h2 class="pt">Prise de commande</h2>';
    const zones=[];S.tables.forEach(t=>{if(!zones.includes(t.zone||''))zones.push(t.zone||'');});
    zones.forEach(z=>{
      if(zones.length>1)h+=`<div class="zone-l">${esc(z||'Autres')}</div>`;
      h+='<div class="grid-t">';
      S.tables.forEach((t,i)=>{if((t.zone||'')!==z)return;
        h+=`<button class="tbtn${d.table===t.name?' sel':''}${busy.has(t.name)?' busy':''}" data-act="table" data-i="${i}">${esc(t.name)}</button>`;});
      h+='</div>';
    });
    if(!S.tables.length)h+='<div class="empty">Aucune table : ajoutez-en dans Réglages.</div>';
    h+=menuBlock()+'<div class="draft">';
    const pop=CATS.resto.filter(s=>d.items[s.k].length);
    if(!pop.length)h+='<div class="empty">Choisissez une table, puis touchez les plats.</div>';
    pop.forEach(s=>{
      h+=`<div class="dsvc"><div class="dsvc-h"><b>${s.l}</b><button class="ftog${d.fire[s.k]?' on':''}" data-act="ftoggle" data-k="${s.k}">${d.fire[s.k]?'À envoyer de suite':'En attente de relance'}</button></div>`;
      d.items[s.k].forEach((it,i)=>h+=`<div class="line"><span>${esc(it.name)}</span><span class="qty"><button data-act="qty" data-k="${s.k}" data-i="${i}" data-d="-1">−</button>${it.qty}<button data-act="qty" data-k="${s.k}" data-i="${i}" data-d="1">+</button></span></div>`);
      h+='</div>';
    });
    h+=`<input id="note" class="txt" style="margin-top:10px" placeholder="Note pour la cuisine (allergie, cuisson…)" value="${esc(d.note)}">`;
    h+=`<button class="btn" data-act="send" ${d.table&&pop.length?'':'disabled'}>${d.table?`Envoyer la table ${esc(d.table)} en cuisine`:'Choisissez une table'}</button></div>`;
    h+='<h3 class="st">Tables en cours · relances</h3>';
    const act=activeResto();
    if(!act.length)h+='<div class="empty">Aucune table en cours.</div>';
    act.slice().sort((a,b)=>a.createdAt-b.createdAt).forEach(o=>{
      h+=`<div class="ao"><div class="ao-h"><b>Table ${esc(o.table)}</b><span>${fmt(o.createdAt)} · ${mins(o.createdAt)} min</span></div><div class="chips">`;
      o.services.forEach(s=>{
        if(s.state==='wait')h+=`<span class="chip">${lbl(s.k)} <button data-act="fire" data-o="${o.id}" data-k="${s.k}">Relancer</button></span>`;
        else if(s.state==='fire')h+=`<span class="chip fire">${lbl(s.k)} · demandé ${fmt(s.firedAt)}</span>`;
        else h+=`<span class="chip sent">${lbl(s.k)} · parti ${fmt(s.sentAt)}</span>`;
      });
      h+='</div></div>';
    });
  }else{
    const d=dr.guing,busy=new Set(guingOpen().map(o=>o.beeper));
    h+='<h2 class="pt">Commande guinguette</h2><div class="lbl">Numéro du beeper</div><div class="grid-t">';
    for(let n=1;n<=S.beeperCount;n++)h+=`<button class="tbtn${d.beeper===n?' sel':''}${busy.has(n)?' busy':''}" data-act="beep" data-n="${n}" ${busy.has(n)?'disabled':''}>${n}</button>`;
    h+='</div>'+menuBlock()+'<div class="draft">';
    const pop=CATS.guing.filter(c=>d.items[c.k].length);
    if(!pop.length)h+='<div class="empty">Choisissez un beeper, puis touchez les plats.</div>';
    pop.forEach(c=>{
      h+=`<div class="dsvc"><div class="dsvc-h"><b>${c.l}</b></div>`;
      d.items[c.k].forEach((it,i)=>h+=`<div class="line"><span>${esc(it.name)}</span><span class="qty"><button data-act="qty" data-k="${c.k}" data-i="${i}" data-d="-1">−</button>${it.qty}<button data-act="qty" data-k="${c.k}" data-i="${i}" data-d="1">+</button></span></div>`);
      h+='</div>';
    });
    h+=`<input id="note" class="txt" style="margin-top:10px" placeholder="Note (sans oignon, bien cuit…)" value="${esc(d.note)}">`;
    h+=`<button class="btn" data-act="send" ${d.beeper&&pop.length?'':'disabled'}>${d.beeper?`Envoyer · beeper n°${d.beeper}`:'Choisissez un beeper'}</button></div>`;
    h+='<h3 class="st">Commandes en cours</h3>';
    const op=guingOpen().sort((a,b)=>a.createdAt-b.createdAt);
    if(!op.length)h+='<div class="empty">Aucune commande en cours.</div>';
    op.forEach(o=>{
      h+=`<div class="ao"><div class="ao-h"><b>Beeper ${o.beeper}</b><span>${fmt(o.createdAt)} · ${mins(o.createdAt)} min</span></div><div class="chips">`;
      if(o.state==='prep')h+=`<span class="chip fire">En préparation</span>`;
      else h+=`<span class="chip ready">Prêt</span><span class="chip"><button data-act="gring" data-o="${o.id}">Faire sonner</button></span><span class="chip"><button data-act="gdone" data-o="${o.id}">Remis</button></span>`;
      h+=`</div></div>`;
    });
  }
  el.innerHTML=h;
}

/* ================= rendu : cuisine ================= */
function renderKitchen(){
  const el=document.getElementById('cuisine');let h='';
  if(mode==='resto'){
    const act=activeResto(),hot=o=>o.services.some(s=>s.state==='fire'),n=hotCount();
    act.sort((a,b)=>(hot(b)-hot(a))||(a.createdAt-b.createdAt));
    h+=`<h2 class="pt">Cuisine · ${n} service${n>1?'s':''} à envoyer</h2>`;
    if(!act.length)h+='<div class="kempty">Aucun bon en cours.</div>';
    h+='<div class="kgrid">';
    act.forEach(o=>{
      h+=`<div class="ticket${hot(o)?' hot':''}"><div class="t-h"><b>Table ${esc(o.table)}</b><span>${fmt(o.createdAt)}<br>${mins(o.createdAt)} min</span></div>`;
      if(o.note)h+=`<div class="t-note">⚠ ${esc(o.note)}</div>`;
      o.services.forEach(s=>{
        const recent=s.state==='fire'&&s.firedAt&&Date.now()-s.firedAt<6000;
        const tag={fire:'À ENVOYER',wait:'EN ATTENTE',sent:'ENVOYÉ'}[s.state];
        h+=`<div class="ksvc ${s.state}${recent?' flash':''}"><div class="ksvc-h"><b>${lbl(s.k)}</b><span class="tag ${s.state}">${tag}</span></div><ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
        if(s.state==='fire')h+=`<button class="kbtn" data-act="sent" data-o="${o.id}" data-k="${s.k}">Envoyé ✓</button>`;
        else if(s.state==='wait')h+=`<button class="kbtn ghost" data-act="fire" data-o="${o.id}" data-k="${s.k}">Lancer quand même</button>`;
        else h+=`<div class="sentline"><span>Envoyé à ${fmt(s.sentAt)}</span><button data-act="undo" data-o="${o.id}" data-k="${s.k}">Annuler</button></div>`;
        h+='</div>';
      });
      h+=`<div class="t-foot"><button class="minib" data-act="preview" data-o="${o.id}">Aperçu du bon</button></div></div>`;
    });
    h+='</div>';
    const dn=doneResto();
    if(dn.length)h+='<h3 class="st">Terminés</h3><div class="done-list">'+dn.map(o=>`<span class="done">Table ${esc(o.table)} · ${fmt(Math.max(...o.services.map(s=>s.sentAt)))}</span>`).join('')+'</div>';
  }else{
    const prep=guingPrep().sort((a,b)=>a.createdAt-b.createdAt),rd=guingReady().sort((a,b)=>a.readyAt-b.readyAt);
    h+=`<h2 class="pt">Cuisine · ${prep.length} commande${prep.length>1?'s':''} à préparer</h2>`;
    if(!prep.length)h+='<div class="kempty">Aucune commande en préparation.</div>';
    h+='<div class="kgrid">';
    prep.forEach(o=>{
      const m=mins(o.createdAt);
      h+=`<div class="ticket${m>=10?' hot':''}"><div class="t-h"><b>Beeper ${o.beeper}</b><span class="${m>=10?'late':''}">${fmt(o.createdAt)}<br>${m} min</span></div>`;
      if(o.note)h+=`<div class="t-note">⚠ ${esc(o.note)}</div>`;
      h+=`<div class="gbody"><ul class="gi">${o.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><button class="kbtn" data-act="gready" data-o="${o.id}">Prêt ✓</button></div>`;
      h+=`<div class="t-foot"><button class="minib" data-act="preview" data-o="${o.id}">Aperçu du bon</button></div></div>`;
    });
    h+='</div>';
    h+=`<h3 class="st">À récupérer · ${rd.length}</h3>`;
    if(!rd.length)h+='<div class="kempty" style="padding:10px 0">Rien en attente au comptoir.</div>';
    h+='<div class="ready-grid">';
    rd.forEach(o=>h+=`<div class="ready"><div class="n">${o.beeper}</div><small>prêt depuis ${mins(o.readyAt)} min</small><button class="kbtn" data-act="gring" data-o="${o.id}">Faire sonner</button><button class="kbtn ghost" data-act="gdone" data-o="${o.id}">Remis au client</button></div>`);
    h+='</div>';
  }
  el.innerHTML=h;
}

/* ================= rendu : réglages ================= */
function renderSettings(){
  let h='<h2 class="pt">Réglages</h2>';
  h+='<div class="card"><h3>Tables du restaurant</h3><p class="h">Renommez, déplacez dans une zone, ajoutez ou supprimez : les changements s’appliquent tout de suite à la prise de commande.</p>';
  h+='<div class="trow" style="margin-bottom:4px"><div class="lbl">Nom / numéro</div><div class="lbl">Zone</div><span></span></div>';
  S.tables.forEach((t,i)=>{h+=`<div class="trow"><input class="txt" data-edit="tname" data-i="${i}" value="${esc(t.name)}"><input class="txt" data-edit="tzone" data-i="${i}" value="${esc(t.zone||'')}" placeholder="(aucune)"><button class="x" data-act="tdel" data-i="${i}" title="Supprimer">✕</button></div>`;});
  h+=`<div class="trow add"><input class="txt" id="ta-n" placeholder="Nouvelle table (ex. 9, T5, Bar)"><input class="txt" id="ta-z" placeholder="Zone"><button class="btn sm" data-act="tadd">Ajouter</button></div>`;
  h+=`<div class="lbl" style="margin-top:14px">Ajouter une série d’un coup</div><div class="trow ser"><input class="txt" id="ts-p" placeholder="Préfixe (ex. T)"><input class="txt" id="ts-a" type="number" placeholder="de" min="0"><input class="txt" id="ts-b" type="number" placeholder="à" min="0"><input class="txt" id="ts-z" placeholder="Zone"><button class="btn sm alt" data-act="tser">Créer</button></div></div>`;
  h+=`<div class="card"><h3>Beepers (guinguette)</h3><p class="h">Nombre de beepers dont vous disposez : la grille de choix s’adapte.</p><input class="txt" id="bcount" type="number" min="1" max="99" value="${S.beeperCount}" style="max-width:120px"></div>`;
  [['resto','Carte du restaurant'],['guing','Carte de la guinguette']].forEach(([m,t])=>{
    h+=`<div class="card"><h3>${t}</h3><p class="h">Ajoutez un plat avec le champ ci-dessous, ✕ pour le retirer.</p>`;
    CATS[m].forEach(c=>{
      h+=`<div class="mcat"><b>${c.l}</b><div class="mitems">`;
      S.menu[m][c.k].forEach((n,i)=>h+=`<span class="mtag"><span>${esc(n)}</span><button data-act="mdel" data-m="${m}" data-k="${c.k}" data-i="${i}" title="Retirer">✕</button></span>`);
      h+=`</div><div class="madd"><input class="txt" id="mi-${m}-${c.k}" placeholder="Ajouter un plat…"><button class="btn sm" data-act="madd" data-m="${m}" data-k="${c.k}">Ajouter</button></div></div>`;
    });
    h+='</div>';
  });
  h+=`<div class="card"><h3>Imprimantes et beepers</h3><p class="h">Dans ce prototype, « Aperçu du bon » montre le ticket qui sortirait en cuisine, et « Faire sonner » est un emplacement prévu pour la liaison avec la borne. Le branchement réel dépendra du modèle des imprimantes et de la borne.</p>
  <div class="note-box">Les réglages sont gardés sur cet appareil. Les commandes, elles, sont des données de démo.</div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm alt" data-act="resetdemo">Recharger les commandes de démo</button><button class="btn sm dng" data-act="resetprefs">Réglages par défaut</button></div></div>`;
  document.getElementById('reglages').innerHTML=h;
}

function renderAll(){renderTop();renderSalle();renderKitchen();renderSettings();}
seed();renderAll();
setInterval(()=>{renderKitchen();renderTop();},20000);
</script>
